version: '3.8'

services:
  # PostgreSQL - data warehouse
  postgres:
    image: postgres:15
    container_name: football_postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data  
      - ./sql:/docker-entrypoint-initdb.d        
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DB_USER}"]
      interval: 5s
      retries: 5

  # PostgreSQL — Airflow metadata database (separate!)
  postgres_airflow:
    image: postgres:15
    container_name: airflow_postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    ports:
      - "5434:5432"
    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5

  # Airflow — pipeline orchestrator
  airflow:
    build: .
    container_name: football_airflow
    depends_on:
      postgres:
        condition: service_healthy       
      postgres_airflow: 
        condition: service_healthy 
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres_airflow:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'  
      AIRFLOW_UID: ${AIRFLOW_UID}
      API_KEY: ${API_KEY}
      COMPETITION_CODE: ${COMPETITION_CODE}
      # Football data DB — reached over the docker network, so use the
      # service name and the INTERNAL port (5432), not the host-mapped ${DB_PORT}.
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./dags:/opt/airflow/dags
      - ./elt:/opt/airflow/elt
      - ./dbt_football:/opt/airflow/dbt_football
      - ./logs:/opt/airflow/logs
    ports:
      - "8080:8080"                      
    command: standalone                 
    user: "${AIRFLOW_UID}:0"

volumes:
  postgres_data:            
  airflow_postgres_data:             